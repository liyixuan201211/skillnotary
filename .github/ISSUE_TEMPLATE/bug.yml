name: Bug
description: Something behaves incorrectly
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and its output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skillnotary version
      description: Output of `skillnotary --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Relevant `skills.json` / `skillnotary.config.json`, OS, and so on.
    validations:
      required: false
