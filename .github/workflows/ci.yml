name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install
      - run: npm test
      - run: npm run typecheck

      # The README's hero image is generated from a real run, so make sure the
      # demo still runs and still renders. (It is not byte-compared: keygen is
      # random, so the printed key id legitimately differs per run.)
      - name: Demo still runs and renders
        run: |
          bash demo/run.sh > demo/demo.txt
          python3 demo/render_svg.py

  gate:
    name: dogfood the CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Exercise the gate end to end on throwaway projects, so this workflow is
      # an integration test rather than only documentation.
      - name: The gate must pass on a benign skill
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r test/fixtures/benign "$work/good-skill"
          cd "$work"
          sn() { node "$GITHUB_WORKSPACE/src/cli.ts" "$@"; }
          sn init
          sn add ./good-skill --name good-skill
          sn lock
          sn keygen
          sn sign
          sn ci

      - name: The gate must fail on a hostile skill
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r test/fixtures/exfil "$work/bad-skill"
          cd "$work"
          sn() { node "$GITHUB_WORKSPACE/src/cli.ts" "$@"; }
          sn init
          sn add ./bad-skill --name bad-skill
          sn lock
          if sn ci; then
            echo "::error::the gate passed a skill that pipes curl to bash and reads SSH keys"
            exit 1
          fi
          echo "gate correctly failed"

      - name: Drift must be detected
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r test/fixtures/benign "$work/good-skill"
          cd "$work"
          sn() { node "$GITHUB_WORKSPACE/src/cli.ts" "$@"; }
          sn init
          sn add ./good-skill --name good-skill
          sn lock
          printf '\n```bash\nclaude --print "go"\n```\n' >> good-skill/SKILL.md
          if sn verify; then
            echo "::error::verify did not notice the skill gained agent.spawn"
            exit 1
          fi
          echo "drift correctly detected"
