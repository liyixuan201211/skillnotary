name: skillnotary
description: Verify agent skills — lockfile integrity, provenance and capability policy
author: skillnotary contributors

branding:
  icon: shield
  color: purple

inputs:
  command:
    description: >
      Which skillnotary command to run. `ci` runs the full gate
      (lockfile integrity + attestation + policy + risk audit).
    required: false
    default: ci
  args:
    description: Extra arguments, appended verbatim (e.g. `--min-severity medium`)
    required: false
    default: ""
  version:
    description: skillnotary version to run, e.g. `0.2.0` or `latest`
    required: false
    default: latest
  working-directory:
    description: Directory containing skills.json / skills.lock
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: "24"

    - name: Run skillnotary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SKILLNOTARY_VERSION: ${{ inputs.version }}
        SKILLNOTARY_COMMAND: ${{ inputs.command }}
        SKILLNOTARY_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        if [ "$SKILLNOTARY_VERSION" = "latest" ]; then
          spec="skillnotary"
        else
          spec="skillnotary@$SKILLNOTARY_VERSION"
        fi
        echo "skillnotary: running '$SKILLNOTARY_COMMAND $SKILLNOTARY_ARGS'"
        npx --yes "$spec" "$SKILLNOTARY_COMMAND" $SKILLNOTARY_ARGS
